<?xml version="1.0" encoding="UTF-8"?>
<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3730a3;stop-opacity:1" />
    </linearGradient>

    <!-- Copper wire gradient -->
    <linearGradient id="copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>

    <!-- Aluminum wire gradient -->
    <linearGradient id="aluminum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#cbd5e1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#94a3b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
    </linearGradient>

    <!-- Insulation gradient -->
    <linearGradient id="insulation" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="150" height="150" fill="url(#bg)" rx="12"/>

  <!-- Copper Wire (top) with insulation -->
  <ellipse cx="75" cy="45" rx="48" ry="8" fill="#991b1b" opacity="0.3"/>
  <ellipse cx="75" cy="45" rx="45" ry="7" fill="url(#insulation)"/>
  <ellipse cx="75" cy="45" rx="38" ry="6" fill="url(#copper)"/>

  <!-- Wire strands detail -->
  <ellipse cx="62" cy="45" rx="3" ry="4" fill="#fbbf24" opacity="0.6"/>
  <ellipse cx="70" cy="45" rx="3" ry="4" fill="#fbbf24" opacity="0.6"/>
  <ellipse cx="78" cy="45" rx="3" ry="4" fill="#fbbf24" opacity="0.6"/>
  <ellipse cx="86" cy="45" rx="3" ry="4" fill="#fbbf24" opacity="0.6"/>

  <!-- Aluminum Wire (bottom) with insulation -->
  <ellipse cx="75" cy="105" rx="48" ry="8" fill="#1e293b" opacity="0.3"/>
  <ellipse cx="75" cy="105" rx="45" ry="7" fill="#334155"/>
  <ellipse cx="75" cy="105" rx="38" ry="6" fill="url(#aluminum)"/>

  <!-- Wire strands detail -->
  <ellipse cx="62" cy="105" rx="3" ry="4" fill="#e2e8f0" opacity="0.6"/>
  <ellipse cx="70" cy="105" rx="3" ry="4" fill="#e2e8f0" opacity="0.6"/>
  <ellipse cx="78" cy="105" rx="3" ry="4" fill="#e2e8f0" opacity="0.6"/>
  <ellipse cx="86" cy="105" rx="3" ry="4" fill="#e2e8f0" opacity="0.6"/>

  <!-- Voltage symbol in center -->
  <path d="M 85 65 L 70 75 L 77 75 L 65 85 L 80 75 L 73 75 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Text label -->
  <text x="75" y="135" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fbbf24" text-anchor="middle">AWG</text>
</svg>
