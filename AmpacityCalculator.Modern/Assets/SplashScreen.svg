<?xml version="1.0" encoding="UTF-8"?>
<svg width="620" height="300" viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgSplash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3730a3;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="wireCu" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>

    <linearGradient id="insulRedSplash" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="insulBlueSplash" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="insulGreenSplash" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="620" height="300" fill="url(#bgSplash)"/>

  <!-- Glow effect -->
  <circle cx="310" cy="150" r="120" fill="url(#glow)"/>

  <!-- Wire bundle visualization -->
  <!-- Red wire (Hot) -->
  <ellipse cx="310" cy="110" rx="140" ry="18" fill="#7f1d1d" opacity="0.3"/>
  <ellipse cx="310" cy="110" rx="135" ry="16" fill="url(#insulRedSplash)"/>
  <ellipse cx="310" cy="110" rx="110" ry="13" fill="url(#wireCu)"/>

  <!-- Copper strand details -->
  <ellipse cx="270" cy="110" rx="8" ry="10" fill="#fcd34d" opacity="0.6"/>
  <ellipse cx="290" cy="110" rx="8" ry="10" fill="#fcd34d" opacity="0.6"/>
  <ellipse cx="310" cy="110" rx="8" ry="10" fill="#fcd34d" opacity="0.7"/>
  <ellipse cx="330" cy="110" rx="8" ry="10" fill="#fcd34d" opacity="0.6"/>
  <ellipse cx="350" cy="110" rx="8" ry="10" fill="#fcd34d" opacity="0.6"/>

  <!-- Blue wire (Neutral) -->
  <ellipse cx="310" cy="150" rx="140" ry="18" fill="#1e3a8a" opacity="0.3"/>
  <ellipse cx="310" cy="150" rx="135" ry="16" fill="url(#insulBlueSplash)"/>
  <ellipse cx="310" cy="150" rx="110" ry="13" fill="url(#wireCu)"/>

  <!-- Copper strand details -->
  <ellipse cx="270" cy="150" rx="8" ry="10" fill="#fcd34d" opacity="0.6"/>
  <ellipse cx="290" cy="150" rx="8" ry="10" fill="#fcd34d" opacity="0.6"/>
  <ellipse cx="310" cy="150" rx="8" ry="10" fill="#fcd34d" opacity="0.7"/>
  <ellipse cx="330" cy="150" rx="8" ry="10" fill="#fcd34d" opacity="0.6"/>
  <ellipse cx="350" cy="150" rx="8" ry="10" fill="#fcd34d" opacity="0.6"/>

  <!-- Green wire (Ground) -->
  <ellipse cx="310" cy="190" rx="140" ry="18" fill="#14532d" opacity="0.3"/>
  <ellipse cx="310" cy="190" rx="135" ry="16" fill="url(#insulGreenSplash)"/>
  <ellipse cx="310" cy="190" rx="110" ry="13" fill="url(#wireCu)"/>

  <!-- Copper strand details -->
  <ellipse cx="270" cy="190" rx="8" ry="10" fill="#fcd34d" opacity="0.6"/>
  <ellipse cx="290" cy="190" rx="8" ry="10" fill="#fcd34d" opacity="0.6"/>
  <ellipse cx="310" cy="190" rx="8" ry="10" fill="#fcd34d" opacity="0.7"/>
  <ellipse cx="330" cy="190" rx="8" ry="10" fill="#fcd34d" opacity="0.6"/>
  <ellipse cx="350" cy="190" rx="8" ry="10" fill="#fcd34d" opacity="0.6"/>

  <!-- Voltage symbol -->
  <path d="M 320 135 L 300 152 L 312 152 L 295 170 L 315 152 L 308 152 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>

  <!-- Title text -->
  <text x="310" y="45" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#fbbf24" text-anchor="middle">AMPACITY CALCULATOR</text>

  <!-- Subtitle -->
  <text x="310" y="70" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">Professional Wire Sizing Tool</text>

  <!-- Bottom info -->
  <text x="310" y="250" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">NEC Compliant  |  14 AWG - 750 kcmil  |  Voltage Drop Calculator</text>
  <text x="310" y="275" font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Copper &amp; Aluminum Wire Sizing</text>
</svg>
